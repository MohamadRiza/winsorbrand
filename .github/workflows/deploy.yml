name: CI/CD Pipeline to Hostinger VPS

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Verify Types (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Create .env.local for build
        run: |
          cat > .env.local << 'EOF'
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}
          EOF

      - name: Build Next.js
        run: npm run build

  deploy:
    name: Deploy to VPS (CD)
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Test VPS SSH Connectivity
        run: |
          echo "=== Testing VPS Connectivity ==="
          TARGET_HOST="${{ secrets.SSH_HOST }}"
          TARGET_PORT="${{ secrets.SSH_PORT || 22 }}"
          echo "Target Host length: ${#TARGET_HOST} characters"
          echo "Target Port: ${TARGET_PORT}"

          if [ -z "$TARGET_HOST" ]; then
            echo "ERROR: SSH_HOST secret is empty! Please configure SSH_HOST in GitHub Secrets."
            exit 1
          fi

          echo "Attempting TCP connection probe to ${TARGET_HOST}:${TARGET_PORT} (timeout: 10s)..."
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/${TARGET_HOST}/${TARGET_PORT}" 2>/dev/null; then
            echo "SUCCESS: Port ${TARGET_PORT} on ${TARGET_HOST} is OPEN and reachable from GitHub Actions!"
          else
            echo "FAILED: Connection to ${TARGET_HOST}:${TARGET_PORT} timed out or was refused."
            echo ""
            echo "Troubleshooting Checkpoints:"
            echo "1. Hostinger hPanel -> VPS -> Security -> Firewall:"
            echo "   Make sure Port ${TARGET_PORT} (TCP) is ALLOWED from Any Source (0.0.0.0/0)."
            echo "2. GitHub Secrets (Settings -> Secrets -> Actions):"
            echo "   Ensure SSH_HOST is the raw IP or domain (e.g., 72.62.122.15) with NO http://, NO port, and NO trailing spaces."
            echo "   Ensure SSH_PORT is 22 (or empty to default to 22)."
            echo "3. On the VPS, ensure UFW/iptables allows incoming traffic on port ${TARGET_PORT}."
            exit 1
          fi

      - name: SSH Deploy & Build
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script: |
            if [ -d "/var/www/winsorbrand" ]; then
              cd /var/www/winsorbrand
            elif [ -d "/root/winsorbrand" ]; then
              cd /root/winsorbrand
            elif [ -d "$HOME/winsorbrand" ]; then
              cd "$HOME/winsorbrand"
            else
              echo "Directory not found! Please verify project folder path on server."
              exit 1
            fi

            echo "Current directory: $(pwd)"
            echo "Fetching latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            npm ci --production=false || npm install --production=false

            echo "Building application..."
            npm run build

            echo "Restarting PM2..."
            pm2 restart winsorbrand --update-env || pm2 restart all --update-env
            pm2 save

            echo "Deployment completed successfully!"